<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Upload Product</title>

  <link
  rel="stylesheet"
  href="style.css">

</head>
<body>

  <div class="upload-container">

    <form id="uploadForm">

      <input
      type="text"
      id="name"
      placeholder="Nama produk"
      required>

      <input
      type="number"
      id="price"
      placeholder="Harga produk"
      required>

      <input
      type="text"
      id="image"
      placeholder="Link gambar"
      required>

      <button
      class="btn primary">

        Upload Product

      </button>

    </form>

  </div>

  <script
  type="module"
  src="seller.js"></script>

</body>
</html>
