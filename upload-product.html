<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Upload Product</title>

  <link rel="stylesheet"
  href="style.css">
  <link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

  <div class="auth-container">

    <form
    class="auth-form"
    id="uploadForm">

      <h1>Upload Product</h1>

      <input
      type="text"
      id="productName"
      placeholder="Product Name"
      required>

      <input
      type="number"
      id="productPrice"
      placeholder="Price"
      required>

      <input
      type="text"
      id="productImage"
      placeholder="Image URL"
      required>

      <button
      type="submit"
      class="btn primary">

        Upload Product

      </button>

    </form>

  </div>

  <script
  type="module"
  src="seller.js"></script>

</body>
</html>
